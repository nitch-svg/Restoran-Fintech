<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yangi Filial Qo'shish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8"
  >
    <div
      class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden"
    >
      <div
        class="bg-gradient-to-r from-blue-600 to-indigo-700 px-6 py-8 sm:px-8 text-white relative"
      >
        <div class="relative z-10">
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">
            Yangi filial qo'shish
          </h1>
          <p class="mt-2 text-blue-100 text-sm sm:text-base">
            Tizimga yangi filial ma'lumotlarini kiriting.
          </p>
        </div>
        <div
          class="absolute right-0 bottom-0 opacity-10 translate-x-10 translate-y-10"
        >
          <svg
            width="200"
            height="200"
            fill="currentColor"
            viewBox="0 0 100 100"
          >
            <circle cx="50" cy="50" r="50" />
          </svg>
        </div>
      </div>

      <form method="POST" action="" class="p-6 sm:p-8 space-y-6">
        {% csrf_token %}

        <div>
          <label
            for="id_name"
            class="block text-sm font-semibold text-slate-700 mb-2"
            >Filial nomi</label
          >
          <div class="relative">
            <input
              type="text"
              name="name"
              id="id_name"
              required
              maxlength="56"
              placeholder="Masalan: Markaziy filial"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out text-slate-800 placeholder-slate-400 text-sm"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label
              for="id_arentr"
              class="block text-sm font-semibold text-slate-700 mb-2"
              >Ijara beruvchi (Arentr)</label
            >
            <input
              type="text"
              name="arentr"
              id="id_arentr"
              required
              maxlength="128"
              placeholder="F.I.O yoki Kompaniya"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out text-slate-800 placeholder-slate-400 text-sm"
            />
          </div>

          <div>
            <label
              for="id_phone"
              class="block text-sm font-semibold text-slate-700 mb-2"
              >Telefon raqam</label
            >
            <input
              type="text"
              name="phone"
              id="id_phone"
              required
              maxlength="15"
              placeholder="+998 (90) 123-45-67"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out text-slate-800 placeholder-slate-400 text-sm"
            />
          </div>
        </div>

        <div
          class="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-4"
        >
          <span
            class="text-xs font-bold text-slate-400 uppercase tracking-wider block"
            >Ish tartibi va vaqtlari</span
          >

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="time_inputs">
            <div>
              <label
                for="id_start"
                class="block text-xs font-semibold text-slate-600 mb-1"
                >Ochilish vaqti</label
              >
              <input
                type="time"
                name="start"
                id="id_start"
                value="09:00"
                class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out text-slate-800 text-sm"
              />
            </div>

            <div>
              <label
                for="id_end"
                class="block text-xs font-semibold text-slate-600 mb-1"
                >Yopilish vaqti</label
              >
              <input
                type="time"
                name="end"
                id="id_end"
                value="23:00"
                class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out text-slate-800 text-sm"
              />
            </div>
          </div>

          <div
            class="flex items-center justify-between pt-2 border-t border-slate-200"
          >
            <div class="flex flex-col">
              <label
                for="id_full_time"
                class="text-sm font-semibold text-slate-700 cursor-pointer"
                >24/7 rejimida ishlaydi</label
              >
              <span class="text-xs text-slate-400"
                >Agarda filial kecha-yu kunduz ochiq bo'lsa yoqing</span
              >
            </div>
            <label
              class="relative inline-flex items-center cursor-pointer select-none"
            >
              <input
                type="checkbox"
                name="full_time"
                id="id_full_time"
                class="sr-only peer"
                onchange="toggleTimeFields(this)"
              />
              <div
                class="w-11 height-6 w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"
              ></div>
            </label>
          </div>
        </div>

        <div
          class="flex flex-col sm:flex-row-reverse gap-3 pt-4 border-t border-slate-100"
        >
          <button
            type="submit"
            class="w-full sm:w-auto px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-100 hover:shadow-indigo-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition duration-150 ease-in-out text-center"
          >
            Saqlash
          </button>
          <a
            href="#"
            class="w-full sm:w-auto px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition duration-150 ease-in-out text-center"
          >
            Bekor qilish
          </a>
        </div>
      </form>
    </div>

    <script>
      function toggleTimeFields(checkbox) {
        const timeInputs = document.getElementById("time_inputs");
        const inputs = timeInputs.querySelectorAll("input");
        if (checkbox.checked) {
          timeInputs.classList.add("opacity-40", "pointer-events-none");
          inputs.forEach((input) => (input.disabled = true));
        } else {
          timeInputs.classList.remove("opacity-40", "pointer-events-none");
          inputs.forEach((input) => (input.disabled = false));
        }
      }
    </script>
  </body>
</html>
